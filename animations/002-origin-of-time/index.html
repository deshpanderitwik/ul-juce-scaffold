<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin of Time</title>
</head>
<body>
<script src="../runtime.js"></script>
<script src="../theme.js"></script>
<script src="../bar.js"></script>
<script>
// The origin of time. A point appears in the dark: the orange one, the
// origin. It swells once, then a line springs out of it to the right: time
// extending from the moment, overshooting a little and settling. The pair
// stays centred as it grows, so the point drifts left and ends up at the
// start of the line. Then the line is
// divided the way music divides it, coarse to fine: the bar's two ends,
// then beats, eighths and sixteenths. Each division is shorter and fainter
// than the one before it, and arrives left to right. Before any of them,
// the point shrinks away: the origin is gone by the time time is divided.
//
// Pure: every frame is computed from ctx.t alone.
(() => {
'use strict';

// Timeline, in seconds
const POINT_AT  = 1.0;   // the point appears
const POINT_IN  = 0.7;   // ...and has settled
const SWELL_AT  = 1.8;   // one slow breath before anything moves
const SWELL_FOR = 1.4;
const LINE_AT   = 3.4;   // the line springs out of the point (settled 1.8 s later)
const TICK_IN   = 0.55;  // how long a tick takes to grow
const POINT_OUT_AT = 5.4;  // the point shrinks away...
const POINT_OUT    = 0.5;
const MARKERS_AT   = POINT_OUT_AT + POINT_OUT + 0.15;   // ...and only then do the markers come

// A gentler spring than 003's: it starts from rest instead of being flung,
// and overshoots by about 7% rather than a quarter. Exactly 1 once settled.
const DAMPING = 5, RING = 6, SETTLED = 1.8;
const gentleSpring = (s) => (s <= 0 ? 0 : s >= SETTLED ? 1
  : 1 - Math.exp(-DAMPING * s) * (Math.cos(RING * s) + DAMPING / RING * Math.sin(RING * s)));

// Shape, in px at 1080p
const POINT_R  = 11;
const LENGTH   = Bar.LENGTH;   // the full line: one bar

// The divisions, coarse to fine, as bar.js defines them (003 starts from
// them). `at` is when the first tick of the level starts growing;
// `stagger` the gap to the next one, left to right.
const LEVELS = Bar.LEVELS.map((level, k) => ({
  ...level,
  at: MARKERS_AT + [0, 1.2, 2.5, 3.7][k],
  stagger: [0.30, 0.14, 0.09, 0.05][k],
}));

Animation({
  width: 1920,
  height: 1080,
  fps: 60,
  duration: 13.2,

  draw(ctx) {
    const { g, width: W, height: H, t, util } = ctx;
    const cy = H / 2;
    g.fillStyle = Theme.bg;
    g.fillRect(0, 0, W, H);
    g.lineCap = 'round';

    // The line, centred while it grows, so its start (the point) drifts left.
    const grow = gentleSpring(t - LINE_AT);
    const len = LENGTH * grow;
    const x0 = W / 2 - len / 2;

    if (len > 0.5) {
      g.strokeStyle = Theme.ink(Bar.LINE_ALPHA);
      g.lineWidth = Theme.stroke;
      g.beginPath();
      g.moveTo(x0, cy);
      g.lineTo(x0 + len, cy);
      g.stroke();

      // A brighter tip while it travels, gone as it reaches full length.
      const tip = 1 - util.smoothstep(0.25, 0.6, t - LINE_AT);
      if (tip > 0) {
        g.fillStyle = Theme.ink(tip);
        g.beginPath();
        g.arc(x0 + len, cy, 3.5, 0, Math.PI * 2);
        g.fill();
      }
    }

    // The divisions. A tick grows out of the line, overshoots a little, and
    // arrives with a flash that fades into its resting brightness.
    g.lineWidth = Theme.stroke;
    for (const level of LEVELS) {
      level.marks.forEach((pos, i) => {
        const age = t - (level.at + i * level.stagger);
        if (age <= 0) return;
        const half = level.half * util.easeOutBack(age / TICK_IN);
        const flash = Math.exp(-age * 4);
        const x = x0 + pos * len;
        g.strokeStyle = Theme.ink(Math.min(1, level.alpha + 0.6 * flash));
        g.beginPath();
        g.moveTo(x, cy - half);
        g.lineTo(x, cy + half);
        g.stroke();
      });
    }

    // The point, on top of everything: born with a ring that spreads and
    // fades, then one slow swell.
    const born = t - POINT_AT;
    if (born > 0) {
      const ring = born / 1.4;
      if (ring < 1) {
        g.strokeStyle = Theme.accent(0.4 * (1 - util.easeOut(ring)));
        g.lineWidth = 2;
        g.beginPath();
        g.arc(x0, cy, POINT_R + 70 * util.easeOut(ring), 0, Math.PI * 2);
        g.stroke();
      }
      const swell = Math.sin(Math.PI * util.clamp((t - SWELL_AT) / SWELL_FOR));
      const gone = util.ease((t - POINT_OUT_AT) / POINT_OUT);
      const r = POINT_R * util.easeOutBack(born / POINT_IN) * (1 + 0.18 * swell) * (1 - gone);
      g.fillStyle = Theme.accent();
      g.beginPath();
      g.arc(x0, cy, Math.max(0, r), 0, Math.PI * 2);
      g.fill();
    }
  },
});
})();
</script>
</body>
</html>
